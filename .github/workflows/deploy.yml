name: Build & Deploy Wanas

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'

jobs:
  # ============================================================
  # LINT & TYPE CHECK — Fast feedback, no test dependencies
  # ============================================================
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Resolve Sharp version
        id: sharp-version
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/sharp'].version" 2>/dev/null || echo unknown)" >> "$GITHUB_OUTPUT"

      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Prepare Sharp cache directory
        run: mkdir -p ~/.cache/sharp

      - name: Cache Sharp binaries
        id: cache-sharp
        uses: actions/cache@v4
        with:
          path: ~/.cache/sharp
          key: sharp-${{ runner.os }}-${{ steps.sharp-version.outputs.version }}
          restore-keys: |
            sharp-${{ runner.os }}-

      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm ci

      - name: Node version info
        run: |
          echo "Node: $(node --version)"
          echo "NPM: $(npm --version)"
          if [[ "$(node --version | cut -d'v' -f2 | cut -d'.' -f1)" -lt 20 ]]; then
            echo "::warning::Node.js version < 20 detected — some features may not work correctly"
          fi

      - name: Lint
        run: npm run lint
        continue-on-error: false

      - name: Type check
        run: npx tsc --noEmit
        continue-on-error: false

  # ============================================================
  # UNIT TESTS — Isolated, with clear diagnostics
  # ============================================================
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Resolve Sharp version
        id: sharp-version
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/sharp'].version" 2>/dev/null || echo unknown)" >> "$GITHUB_OUTPUT"

      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Prepare Sharp cache directory
        run: mkdir -p ~/.cache/sharp

      - name: Cache Sharp binaries
        id: cache-sharp
        uses: actions/cache@v4
        with:
          path: ~/.cache/sharp
          key: sharp-${{ runner.os }}-${{ steps.sharp-version.outputs.version }}
          restore-keys: |
            sharp-${{ runner.os }}-

      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm ci

      - name: Run unit tests (with JUnit output for annotations)
        id: unit-tests
        run: |
          npm run test -- --reporter=junit --outputFile=junit.xml 2>&1 | tee test-output.txt
        continue-on-error: true

      - name: Annotate test failures
        if: failure() || steps.unit-tests.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            junit.xml
            test-output.txt
          retention-days: 7

      - name: Publish test results (JUnit)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-report
          path: junit.xml
          retention-days: 7

      - name: Check test results
        if: steps.unit-tests.outcome == 'failure'
        run: |
          echo "::error::Unit tests failed — see test-output.txt artifact for details"
          cat test-output.txt
          exit 1

  # ============================================================
  # E2E TESTS — Optional, non-blocking for visibility
  # ============================================================
  e2e-tests:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Resolve Sharp version
        id: sharp-version
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/sharp'].version" 2>/dev/null || echo unknown)" >> "$GITHUB_OUTPUT"

      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Prepare Sharp cache directory
        run: mkdir -p ~/.cache/sharp

      - name: Cache Sharp binaries
        id: cache-sharp
        uses: actions/cache@v4
        with:
          path: ~/.cache/sharp
          key: sharp-${{ runner.os }}-${{ steps.sharp-version.outputs.version }}
          restore-keys: |
            sharp-${{ runner.os }}-

      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build for E2E
        run: npm run build

      - name: Run E2E tests
        run: npm run test:e2e -- --reporter=junit --outputFile=e2e-junit.xml 2>&1 | tee e2e-output.txt
        continue-on-error: true

      - name: Upload E2E results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: |
            e2e-junit.xml
            e2e-output.txt
          retention-days: 7

  # ============================================================
  # VALIDATION & AUDIT — Security & data integrity
  # ============================================================
  validate-and-audit:
    name: Validate Data & Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Resolve Sharp version
        id: sharp-version
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/sharp'].version" 2>/dev/null || echo unknown)" >> "$GITHUB_OUTPUT"

      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Prepare Sharp cache directory
        run: mkdir -p ~/.cache/sharp

      - name: Cache Sharp binaries
        id: cache-sharp
        uses: actions/cache@v4
        with:
          path: ~/.cache/sharp
          key: sharp-${{ runner.os }}-${{ steps.sharp-version.outputs.version }}
          restore-keys: |
            sharp-${{ runner.os }}-

      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm ci

      - name: Validate data
        run: npm run validate:data
        continue-on-error: false

      - name: Dependency audit (high/critical)
        run: npm audit --audit-level=high --omit=dev
        continue-on-error: false

  # ============================================================
  # BUILD — Only runs if lint/typecheck pass
  # ============================================================
  build:
    name: Build
    needs: [lint-and-typecheck]
    runs-on: ubuntu-latest
    outputs:
      main-size: ${{ steps.size-check.outputs.main-size }}
      admin-size: ${{ steps.size-check.outputs.admin-size }}
      optimize-seconds: ${{ steps.optimize-images.outputs.optimize-seconds }}
      optimized-image-count: ${{ steps.verify-images.outputs.optimized-image-count }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Resolve Sharp version
        id: sharp-version
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/sharp'].version" 2>/dev/null || echo unknown)" >> "$GITHUB_OUTPUT"

      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Prepare Sharp cache directory
        run: mkdir -p ~/.cache/sharp

      - name: Cache Sharp binaries
        id: cache-sharp
        uses: actions/cache@v4
        with:
          path: ~/.cache/sharp
          key: sharp-${{ runner.os }}-${{ steps.sharp-version.outputs.version }}
          restore-keys: |
            sharp-${{ runner.os }}-

      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm ci

      - name: Cache Vite
        uses: actions/cache@v4
        with:
          path: |
            node_modules/.cache/vite
            node_modules/.cache/vite-plugin-image-optimizer
          key: vite-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            vite-${{ runner.os }}-

      - name: Sync products from sheet_data
        run: npm run sync:products
        continue-on-error: true

      - name: Check image sources
        id: image-sources
        run: |
          if [ ! -d src/assets/products ]; then
            echo "::error::src/assets/products/ is missing — product source images are not present in the repository."
            echo "::error::The optimization step cannot run until source images are committed (owned by the frontend image task)."
            exit 1
          fi
          SOURCE_COUNT=$(find src/assets/products -type f \( -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.png' -o -iname '*.webp' -o -iname '*.avif' \) | wc -l | tr -d ' ')
          echo "Found $SOURCE_COUNT source image(s) in src/assets/products/"
          if [ "$SOURCE_COUNT" -eq 0 ]; then
            echo "::error::src/assets/products/ contains no images — nothing to optimize."
            exit 1
          fi
          echo "source-count=$SOURCE_COUNT" >> "$GITHUB_OUTPUT"

      - name: Optimize images
        id: optimize-images
        run: |
          OPTIMIZE_START=$(date +%s)
          npm run optimize:images
          OPTIMIZE_END=$(date +%s)
          echo "optimize-seconds=$((OPTIMIZE_END - OPTIMIZE_START))" >> "$GITHUB_OUTPUT"
          echo "⏱️ Optimize images: $((OPTIMIZE_END - OPTIMIZE_START))s"

      - name: Verify optimized images
        id: verify-images
        run: |
          PRODUCTS_DIR="public/products"
          if [ ! -d "$PRODUCTS_DIR" ]; then
            echo "::error::$PRODUCTS_DIR/ was not created by the optimization step."
            exit 1
          fi

          WEBP_COUNT=$(find "$PRODUCTS_DIR" -type f -name '*.webp' | wc -l | tr -d ' ')
          AVIF_COUNT=$(find "$PRODUCTS_DIR" -type f -name '*.avif' | wc -l | tr -d ' ')
          FALLBACK_COUNT=$(find "$PRODUCTS_DIR" -type f \( -name '*.jpeg' -o -name '*.jpg' -o -name '*.png' \) | wc -l | tr -d ' ')

          WIDTHS=""
          for w in 400 800 1200; do
            if [ -n "$(find "$PRODUCTS_DIR" -type f -name "*-${w}w.*" -print -quit)" ]; then
              WIDTHS="$WIDTHS $w"
            fi
          done
          WIDTH_COUNT=$(echo "$WIDTHS" | wc -w | tr -d ' ')

          echo "WebP: $WEBP_COUNT | AVIF: $AVIF_COUNT | JPEG/PNG fallback: $FALLBACK_COUNT | responsive widths:$WIDTHS"

          if [ "$WEBP_COUNT" -eq 0 ]; then
            echo "::error::No WebP outputs found in $PRODUCTS_DIR/ — optimization did not produce modern formats."
            exit 1
          fi
          if [ "$AVIF_COUNT" -eq 0 ]; then
            echo "::error::No AVIF outputs found in $PRODUCTS_DIR/ — optimization did not produce modern formats."
            exit 1
          fi
          if [ "$WIDTH_COUNT" -lt 2 ]; then
            echo "::error::Expected multiple responsive widths in $PRODUCTS_DIR/, found $WIDTH_COUNT (need >= 2)."
            exit 1
          fi
          if [ ! -f "$PRODUCTS_DIR/manifest.json" ]; then
            echo "::error::Missing $PRODUCTS_DIR/manifest.json."
            exit 1
          fi

          echo "optimized-image-count=$WEBP_COUNT" >> "$GITHUB_OUTPUT"
          echo "✅ Verified optimized images in $PRODUCTS_DIR/ (WebP: $WEBP_COUNT, AVIF: $AVIF_COUNT, widths:$WIDTHS)"

      - name: Dependency cache report
        if: always()
        run: |
          {
            echo "### Dependency cache"
            echo ""
            echo "| Cache | Result |"
            echo "|---|---|"
            echo "| node_modules | ${{ steps.cache-node-modules.outputs.cache-hit == 'true' && 'HIT' || 'MISS' }} |"
            echo "| Sharp binaries (~/.cache/sharp) | ${{ steps.cache-sharp.outputs.cache-hit == 'true' && 'HIT' || 'MISS' }} |"
            echo ""
            echo "**Sharp version:** ${{ steps.sharp-version.outputs.version }}"
            echo "**Optimize images duration:** ${{ steps.optimize-images.outputs.optimize-seconds }}s"
            echo "**Sharp cache dir entries:** $(ls -A ~/.cache/sharp 2>/dev/null | wc -l | tr -d ' ')"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build
        run: npm run build

      - name: Create 404.html for SPA fallback
        run: cp dist/index.html dist/404.html

      - name: Verify bundle size budgets
        id: size-check
        run: |
          MAIN_JS=$(find dist/assets -name 'main-*.js' ! -name '*.map' | head -1)
          ADMIN_JS=$(find dist/assets -name 'admin-*.js' ! -name '*.map' | head -1)
          MAIN_GZ=$(gzip -c "$MAIN_JS" | wc -c)
          ADMIN_GZ=$(gzip -c "$ADMIN_JS" | wc -c)
          echo "main-size=$MAIN_GZ" >> $GITHUB_OUTPUT
          echo "admin-size=$ADMIN_GZ" >> $GITHUB_OUTPUT
          echo "Main JS (gzipped): $MAIN_GZ bytes"
          echo "Admin JS (gzipped): $ADMIN_GZ bytes"
          if [ "$MAIN_GZ" -gt 102400 ]; then
            echo "::error::Main bundle exceeds 100KB gzipped budget ($MAIN_GZ bytes)"
            exit 1
          fi
          if [ "$ADMIN_GZ" -gt 51200 ]; then
            echo "::error::Admin bundle exceeds 50KB gzipped budget ($ADMIN_GZ bytes)"
            exit 1
          fi

      - name: Upload build artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
          name: github-pages

  # ============================================================
  # LIGHTHOUSE CI — Runs independently for visibility (non-blocking)
  # ============================================================
  lighthouse:
    name: Lighthouse CI
    needs: [build]
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Resolve Sharp version
        id: sharp-version
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/sharp'].version" 2>/dev/null || echo unknown)" >> "$GITHUB_OUTPUT"

      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Prepare Sharp cache directory
        run: mkdir -p ~/.cache/sharp

      - name: Cache Sharp binaries
        id: cache-sharp
        uses: actions/cache@v4
        with:
          path: ~/.cache/sharp
          key: sharp-${{ runner.os }}-${{ steps.sharp-version.outputs.version }}
          restore-keys: |
            sharp-${{ runner.os }}-

      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm ci

      - name: Build for Lighthouse
        run: npm run build

      - name: Start Vite preview server
        run: |
          npx vite preview --port 3000 --host 0.0.0.0 &
          echo "Vite preview server started on port 3000"
          sleep 5
          curl -f http://localhost:3000 || exit 1

      - name: Serve and run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v11
        with:
          urls: |
            http://localhost:3000
            http://localhost:3000/admin.html
          budgetPath: ./lighthouse-budget.json
          uploadArtifacts: true

  # ============================================================
  # PREVIEW DEPLOY — For PRs, runs after build succeeds
  # ============================================================
  preview-deploy:
    name: Preview Deploy
    needs: [build]
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages Preview
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages
          token: ${{ secrets.GITHUB_TOKEN }}

  # ============================================================
  # DEPLOY — Production deploy on main branch
  # ============================================================
  deploy:
    name: Deploy to Production
    needs: [build]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # ============================================================
  # STATUS SUMMARY — Aggregates all job results for PR checks
  # ============================================================
  status-summary:
    name: CI Status Summary
    needs:
      - lint-and-typecheck
      - unit-tests
      - e2e-tests
      - validate-and-audit
      - build
      - lighthouse
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check job statuses
        run: |
          echo "## CI Status Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Lint & Type Check | ${{ needs.lint-and-typecheck.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Unit Tests | ${{ needs.unit-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| E2E Tests (non-blocking) | ${{ needs.e2e-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Validate & Audit | ${{ needs.validate-and-audit.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build | ${{ needs.build.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Lighthouse CI | ${{ needs.lighthouse.result }} |" >> $GITHUB_STEP_SUMMARY

      - name: Fail if any required job failed
        run: |
          FAILED=0
          # Check each required job explicitly
          if [[ "${{ needs.lint-and-typecheck.result }}" != "success" && "${{ needs.lint-and-typecheck.result }}" != "skipped" ]]; then
            echo "Required job 'lint-and-typecheck' failed with status: ${{ needs.lint-and-typecheck.result }}"
            FAILED=1
          fi
          if [[ "${{ needs.unit-tests.result }}" != "success" && "${{ needs.unit-tests.result }}" != "skipped" ]]; then
            echo "Required job 'unit-tests' failed with status: ${{ needs.unit-tests.result }}"
            FAILED=1
          fi
          if [[ "${{ needs.validate-and-audit.result }}" != "success" && "${{ needs.validate-and-audit.result }}" != "skipped" ]]; then
            echo "Required job 'validate-and-audit' failed with status: ${{ needs.validate-and-audit.result }}"
            FAILED=1
          fi
          if [[ "${{ needs.build.result }}" != "success" && "${{ needs.build.result }}" != "skipped" ]]; then
            echo "Required job 'build' failed with status: ${{ needs.build.result }}"
            FAILED=1
          fi
          # Lighthouse is non-blocking (continue-on-error: true) — don't fail on it
          if [[ $FAILED -eq 1 ]]; then
            exit 1
          fi
